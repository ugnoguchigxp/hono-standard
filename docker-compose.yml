services:
  app:
    build: .
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5173
      DATABASE_URL: /data/sqlite.db
      JWT_SECRET: hono-standard-compose-jwt-secret-change-before-production
      APP_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: lax
      SECURITY_HEADERS_MODE: http
    volumes:
      - ./.db-data:/data
