services:
  db:
    image: pgvector/pgvector:pg17
    container_name: hono-standard-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hono_standard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hono_standard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 15s

  app:
    build: .
    stop_grace_period: 15s
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5173
      DATABASE_URL: postgres://postgres:postgres@db:5432/hono_standard
      JWT_SECRET: ${COMPOSE_JWT_SECRET:?Set COMPOSE_JWT_SECRET to a 32+ character production secret before running docker compose.}
      APP_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: lax
      SECURITY_HEADERS_MODE: http

volumes:
  postgres-data:
