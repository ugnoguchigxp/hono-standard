services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hono_standard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hono_standard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5173
      DATABASE_URL: postgres://postgres:postgres@db:5432/hono_standard
      APP_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      SECURITY_HEADERS_MODE: http
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
