services:
  data-init:
    build: .
    user: "0:0"
    entrypoint: ["sh", "/app/scripts/init-data-dir.sh"]
    healthcheck:
      disable: true
    restart: "no"
    volumes:
      - ./data:/data
  app:
    build: .
    stop_grace_period: 15s
    depends_on:
      data-init:
        condition: service_completed_successfully
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5173
      DATABASE_URL: /data/sqlite.db
      APP_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      SECURITY_HEADERS_MODE: http
    volumes:
      - ./data:/data
